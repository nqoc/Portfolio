<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cute-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8ED"/>
      <stop offset="50%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#E8F8F5"/>
    </linearGradient>
    <radialGradient id="cute-glow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FF7C93" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF7C93" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF7C93" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="480" fill="url(#cute-bg)"/>
  <circle cx="200" cy="180" r="140" fill="url(#cute-glow)"/>
  
  <!-- Cute dashed border -->
  <rect x="20" y="20" width="360" height="440" rx="20" fill="none" stroke="#FF7C93" stroke-width="2" stroke-dasharray="6,6" opacity="0.45"/>

  <!-- Cute Character Illustration -->
  <g transform="translate(100, 75)" filter="url(#soft-sh)">
    <!-- Hair back -->
    <path d="M45 120 C35 70, 70 30, 100 30 C130 30, 165 70, 155 120 C155 180, 145 220, 135 230 C125 180, 130 140, 100 140 C70 140, 75 180, 65 230 C55 220, 45 180, 45 120 Z" fill="#3D312A"/>
    <!-- Cute hair buns/curls -->
    <circle cx="50" cy="65" r="22" fill="#3D312A"/>
    <circle cx="150" cy="65" r="22" fill="#3D312A"/>
    <!-- Head / Face -->
    <ellipse cx="100" cy="115" rx="42" ry="44" fill="#FFF2EB"/>
    <!-- Hair bangs -->
    <path d="M58 95 C75 80, 90 98, 100 90 C110 98, 125 80, 142 95 C142 80, 130 50, 100 50 C70 50, 58 80, 58 95 Z" fill="#3D312A"/>
    <!-- Friendly smiling eyes -->
    <path d="M80 114 Q88 108 96 114" fill="none" stroke="#2C2620" stroke-width="3" stroke-linecap="round"/>
    <path d="M104 114 Q112 108 120 114" fill="none" stroke="#2C2620" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyelashes -->
    <line x1="78" y1="110" x2="74" y2="106" stroke="#2C2620" stroke-width="2" stroke-linecap="round"/>
    <line x1="122" y1="110" x2="126" y2="106" stroke="#2C2620" stroke-width="2" stroke-linecap="round"/>
    <!-- Cute blush cheeks -->
    <ellipse cx="78" cy="125" rx="8" ry="5" fill="#FF7C93" opacity="0.6"/>
    <ellipse cx="122" cy="125" rx="8" ry="5" fill="#FF7C93" opacity="0.6"/>
    <!-- Sweet smile -->
    <path d="M94 130 Q100 137 106 130" fill="none" stroke="#FF5470" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tulip hairpin -->
    <g transform="translate(132, 60) scale(0.75)">
      <path d="M15 5 C10 12, 5 18, 5 26 C5 32, 10 36, 15 36 C20 36, 25 32, 25 26 C25 18, 20 12, 15 5 Z" fill="#FF6584"/>
      <path d="M15 8 C13 14, 11 20, 11 25 C11 29, 13 32, 15 34 C17 32, 19 29, 19 25 C19 20, 17 14, 15 8 Z" fill="#FFE2C9"/>
      <circle cx="15" cy="40" r="3" fill="#2FB8A4"/>
    </g>
    <!-- Shoulders & cute knit sweater -->
    <path d="M35 240 C45 175, 75 168, 100 168 C125 168, 155 175, 165 240 Z" fill="#FF9AA2"/>
    <path d="M82 168 Q100 190 118 168 Z" fill="#FFF2EB"/>
    <circle cx="100" cy="205" r="4" fill="#FFFFFF"/>
    <circle cx="100" cy="225" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Cute Name Label -->
  <g transform="translate(200, 395)" text-anchor="middle">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FF7C93" stroke-width="2"/>
    <text y="5" font-family="'Baloo 2', sans-serif" font-size="16" font-weight="800" fill="#2C2620">🌷 Nguyễn Như Ngọc</text>
    <text y="42" font-family="'Caveat', cursive" font-size="18" font-weight="700" fill="#E1660F">DUT IT · Japanese Program 🌸</text>
  </g>
</svg>